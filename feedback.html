 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Feedback</title>
</head>
<body>                   
  
  <h1>Submit Feedback</h1>

  
  <form>

    
    <label for="name"><b>Your Name:</b></label><br>
    <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

    
    <label for="email"><b>Your Email:</b></label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

    
    <label for="type"><b>Type of Feedback:</b></label><br>
    <select id="type" name="type"><br>
      <option value="suggestion">Suggestion</option>
      <option value="complaint">Complaint</option>
      <option value="question">Question</option>
      <option value="other">Other</option>
    </select><br><br>
    <br><br>

    
    <label><b>Rate Our Website:</b></label><br>
    <input type="radio" name="rating" value="excellent"> Excellent
    <input type="radio" name="rating" value="good"> Good
    <input type="radio" name="rating" value="average"> Average
    <input type="radio" name="rating" value="poor"> Poor
    <br><br>
    <br><br>

    
    <label><b>Would you recommend us to others?</b></label><br>
    <input type="checkbox" name="recommend" value="yes"> Yes, I would recommend
    <br><br>
    <br><br>

    
    <label for="message"><b>Your Feedback:</b></label><br>
    <textarea id="message
" name="message" rows="5" cols="40" placeholder="Write your feedback here..."></textarea><br><br>
    <br><br>
    <b><input type="submit" value="Submit Feedback"></b>
    </form>

      <li><a href="grade.html">grade</a></li>
      <li><a href="contact.html">contact</a></li>
    </ul>
  </nav>


</body>
</html>
